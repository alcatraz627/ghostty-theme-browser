<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghostty Config Manager</title>
<style>
  :root {
    --bg: #16161e;
    --surface: #1e1e2a;
    --text: #c8ccd8;
    --dim: #7a7f92;
    --border: #2c2f3e;
    --accent: #7aa2f7;
    --comment: #565c74;
    --key: #9ece6a;
    --value: #e0af68;
  }
  :root[data-theme="light"] {
    --bg: #f4f4f6;
    --surface: #ffffff;
    --text: #2a2d3a;
    --dim: #6b7085;
    --border: #d9dbe3;
    --accent: #2f5fd0;
    --comment: #9a9eb0;
    --key: #4d7a1e;
    --value: #a05f0a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .badge {
    font-size: 12px; color: var(--dim); border: 1px solid var(--border);
    border-radius: 6px; padding: 2px 8px;
  }
  #theme-toggle, .seg button {
    cursor: pointer; background: none; border: 1px solid var(--border);
    color: var(--text); border-radius: 6px; padding: 4px 10px; font: inherit;
  }
  .seg { margin-left: auto; display: flex; gap: 0; }
  .seg button { border-radius: 0; border-right-width: 0; }
  .seg button:first-child { border-radius: 6px 0 0 6px; }
  .seg button:last-child { border-radius: 0 6px 6px 0; border-right-width: 1px; }
  .seg button.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  #editor-actions { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  #editor-actions button, .row button, #form-view .apply {
    cursor: pointer; background: none; border: 1px solid var(--border);
    color: var(--text); border-radius: 6px; padding: 4px 12px; font: inherit;
  }
  #save-btn { border-color: var(--accent); color: var(--accent); }
  #banner {
    margin: 10px 0; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface);
  }
  #banner.ok { border-color: var(--key); }
  #banner.bad { border-color: #f7768e; }
  #form-toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
  #form-search {
    flex: 1; background: var(--surface); color: var(--text); font: inherit;
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px;
  }
  .cat-title { margin: 18px 0 8px; font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; }
  .row {
    display: grid; grid-template-columns: minmax(220px, 1fr) minmax(200px, 1.4fr) auto;
    gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--border);
    border-radius: 8px; margin-bottom: 6px; background: var(--surface);
  }
  .row.modified { border-left: 3px solid var(--accent); }
  .row .k { color: var(--key); word-break: break-all; }
  .row .d { display: block; color: var(--dim); font-size: 12px; margin-top: 2px; }
  .row .platform { color: var(--value); font-size: 11px; margin-left: 6px; }
  .row input[type="text"], .row input[type="number"], .row select, .row textarea {
    width: 100%; background: var(--bg); color: var(--text); font: inherit;
    border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px;
  }
  .row input[type="color"] { width: 42px; height: 30px; padding: 1px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; }
  .color-wrap { display: flex; gap: 8px; align-items: center; }
  .color-wrap input[type="text"] { flex: 1; }
  #editor-view[hidden], #viewer-view[hidden] { display: none; }
  #editor {
    width: 100%; min-height: 55vh; resize: vertical;
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 16px; font: inherit; line-height: 1.5;
  }
  #lint-status { margin: 10px 0 4px; color: var(--dim); }
  #lint-status.ok { color: var(--key); }
  #lint-status.bad { color: #f7768e; }
  #diagnostics { list-style: none; margin: 4px 0 0; padding: 0; }
  #diagnostics li {
    border: 1px solid var(--border); border-left: 3px solid #f7768e;
    border-radius: 6px; padding: 6px 10px; margin-bottom: 6px;
    background: var(--surface); cursor: pointer;
  }
  #diagnostics .loc { color: var(--accent); margin-right: 8px; }
  #diagnostics .key { color: var(--key); margin-right: 8px; }
  main { padding: 20px; max-width: 900px; margin: 0 auto; }
  #config-path { color: var(--accent); word-break: break-all; }
  pre {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 16px; overflow-x: auto; white-space: pre-wrap;
  }
  .c { color: var(--comment); }
  .k { color: var(--key); }
  .v { color: var(--value); }
  .swatch {
    display: inline-block; width: 10px; height: 10px; border-radius: 2px;
    border: 1px solid var(--border); margin-right: 4px; vertical-align: baseline;
  }
  #error { color: #f7768e; }
</style>
</head>
<body>
<header>
  <h1>Ghostty Config Manager</h1>
  <span class="badge" id="version">…</span>
  <nav class="seg" id="view-seg">
    <button type="button" data-view="viewer" class="active">View</button>
    <button type="button" data-view="editor">Edit</button>
    <button type="button" data-view="form">Form</button>
  </nav>
  <button id="theme-toggle" type="button">light</button>
</header>
<main>
  <p>Live config: <span id="config-path">…</span></p>
  <p id="error" hidden></p>
  <div id="banner" hidden></div>
  <section id="viewer-view" data-view="viewer">
    <pre id="config"></pre>
  </section>
  <section id="editor-view" data-view="editor" hidden>
    <textarea id="editor" spellcheck="false"></textarea>
    <div id="editor-actions">
      <button id="save-btn" type="button">Save to config</button>
      <span id="lint-status">Start typing to lint.</span>
    </div>
    <ul id="diagnostics"></ul>
  </section>
  <section id="form-view" data-view="form" hidden>
    <div id="form-toolbar">
      <input id="form-search" type="search" placeholder="Search settings (key or description)…">
      <span class="badge" id="form-count"></span>
    </div>
    <div id="form-body"><p>Loading schema…</p></div>
  </section>
</main>
<script>
  const qs = new URLSearchParams(location.search);
  const token = qs.get("token") || "";

  const root = document.documentElement;
  const toggle = document.getElementById("theme-toggle");
  function setTheme(t) {
    root.dataset.theme = t;
    toggle.textContent = t === "light" ? "dark" : "light";
    localStorage.setItem("theme", t);
  }
  setTheme(localStorage.getItem("theme") || "dark");
  toggle.addEventListener("click", () =>
    setTheme(root.dataset.theme === "light" ? "dark" : "light"));

  async function api(path) {
    const res = await fetch(path, { headers: { "x-app-token": token } });
    if (!res.ok) throw new Error(`${path}: ${res.status} ${(await res.json()).error || ""}`);
    return res.json();
  }

  const esc = (s) => String(s).replace(/[&<>"']/g,
    (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));

  // One config line -> highlighted HTML. Comments dim; key/value colored;
  // hex colors get an inline swatch.
  function renderLine(line) {
    if (/^\s*#/.test(line)) return `<span class="c">${esc(line)}</span>`;
    const m = line.match(/^(\s*)([a-z0-9-]+)(\s*=\s*)(.*)$/i);
    if (!m) return esc(line);
    const [, pad, key, eq, value] = m;
    const withSwatches = esc(value).replace(/#[0-9a-fA-F]{6}\b/g,
      (hex) => `<span class="swatch" style="background:${hex}"></span>${hex}`);
    return `${pad}<span class="k">${esc(key)}</span>${esc(eq)}<span class="v">${withSwatches}</span>`;
  }

  async function postApi(path, payload) {
    const res = await fetch(path, {
      method: "POST",
      headers: { "x-app-token": token, "content-type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error(`${path}: ${res.status} ${(await res.json()).error || ""}`);
    return res.json();
  }

  // ── shared state ──
  const editor = document.getElementById("editor");
  let cfgContent = "";
  let meta = null;
  let schema = null;

  function setContent(content) {
    cfgContent = content || "";
    document.getElementById("config").innerHTML =
      cfgContent.split("\n").map(renderLine).join("\n");
    if (document.activeElement !== editor) editor.value = cfgContent;
  }

  // key → every value the user's config sets for it, in file order.
  function valuesFromContent() {
    const map = {};
    for (const line of cfgContent.split("\n")) {
      const m = line.match(/^\s*([A-Za-z0-9_-]+)\s*=\s*(.*?)\s*$/);
      if (m) (map[m[1]] ??= []).push(m[2]);
    }
    return map;
  }

  const banner = document.getElementById("banner");
  function showBanner(kind, html) {
    banner.hidden = false;
    banner.className = kind;
    banner.innerHTML = html;
  }
  function reloadHintHtml(prefix) {
    const kb = meta?.reloadKeybind || "super+shift+,";
    return `${esc(prefix)} Press <b>${esc(kb)}</b> in Ghostty to apply.`;
  }

  // ── view switching ──
  const seg = document.getElementById("view-seg");
  seg.addEventListener("click", (e) => {
    const view = e.target.dataset.view;
    if (!view) return;
    for (const btn of seg.querySelectorAll("button")) {
      btn.classList.toggle("active", btn.dataset.view === view);
    }
    for (const sec of document.querySelectorAll("main section[data-view]")) {
      sec.hidden = sec.dataset.view !== view;
    }
    if (view === "editor") { editor.focus(); runLint(); }
    if (view === "form") ensureForm();
  });

  // ── raw editor save (validation-gated, explicit save-anyway) ──
  document.getElementById("save-btn").addEventListener("click", async () => {
    try {
      let r = await postApi("/api/config/save", { content: editor.value });
      if (!r.ok && r.reason === "validation failed") {
        const n = r.lint.diagnostics.length + r.lint.fileLevel.length;
        if (!confirm(`Config has ${n} problem(s). Ghostty ignores bad lines — save anyway?`)) return;
        r = await postApi("/api/config/save", { content: editor.value, force: true });
      }
      if (r.ok) {
        setContent(r.content);
        renderForm();
        showBanner("ok", reloadHintHtml("Saved."));
      } else {
        showBanner("bad", esc(`Save failed: ${r.reason}`));
      }
    } catch (err) {
      showBanner("bad", esc(err.message));
    }
  });

  // ── form view ──
  const formBody = document.getElementById("form-body");
  const formSearch = document.getElementById("form-search");
  const formCount = document.getElementById("form-count");
  const CAT_ORDER = ["Fonts", "Colors", "Cursor", "Window", "Terminal", "Shell",
    "Clipboard", "Mouse", "Keybinds", "Quick Terminal", "macOS", "Linux/GTK", "Other"];

  async function ensureForm() {
    if (schema) return;
    try {
      schema = await api("/api/schema");
      renderForm();
    } catch (err) {
      formBody.innerHTML = `<p>Failed to load schema: ${esc(err.message)}</p>`;
    }
  }

  function controlHtml(o, current) {
    const val = current ?? o.default ?? "";
    const k = `data-key="${esc(o.key)}"`;
    switch (o.type) {
      case "boolean":
        return `<input type="checkbox" ${k} ${val === "true" ? "checked" : ""}>`;
      case "number":
        return `<input type="number" step="any" ${k} value="${esc(val)}">`;
      case "enum": {
        const opts = [...new Set([val, ...(o.enumValues || [])])]
          .filter((v) => v !== "")
          .map((v) => `<option ${v === val ? "selected" : ""}>${esc(v)}</option>`);
        return `<select ${k}><option value="" ${val === "" ? "selected" : ""}>(default)</option>${opts.join("")}</select>`;
      }
      case "color": {
        // Ghostty color values also accept X11 names, cell-* specials, and
        // comma lists. The native picker can only faithfully represent hex,
        // so for anything else render text-only — a #000000 fallback swatch
        // silently destroys the real value on first confirm.
        const isHex = /^#?[0-9a-fA-F]{6}$/.test(val);
        if (val !== "" && !isHex) {
          return `<input type="text" ${k} value="${esc(val)}">`;
        }
        const hex = isHex ? (val.startsWith("#") ? val : "#" + val) : "#000000";
        return `<span class="color-wrap"><input type="color" ${k} data-role="swatch" value="${esc(hex)}"><input type="text" ${k} value="${esc(val)}"></span>`;
      }
      default:
        return `<input type="text" ${k} value="${esc(val)}">`;
    }
  }

  function renderForm() {
    if (!schema) return;
    const q = formSearch.value.trim().toLowerCase();
    const values = valuesFromContent();
    const opts = schema.options.filter(
      (o) => !q || o.key.includes(q) || o.doc.toLowerCase().includes(q)
    );
    formCount.textContent = `${opts.length} settings`;
    const byCat = {};
    for (const o of opts) (byCat[o.category] ??= []).push(o);
    let html = "";
    for (const cat of CAT_ORDER) {
      if (!byCat[cat]) continue;
      html += `<div class="cat-title">${esc(cat)}</div>`;
      for (const o of byCat[cat]) {
        const userVals = values[o.key];
        const modified = !!userVals;
        const shortDoc = esc((o.doc.split(/\.\s|\n/)[0] || "").slice(0, 110));
        const plat = o.platform === "linux" ? `<span class="platform">GTK/Linux</span>` : "";
        let control, actions;
        if (o.type === "list") {
          const items = (userVals || []).join("\n");
          const rows = Math.min(6, (userVals?.length || 1) + 1);
          control = `<textarea rows="${rows}" data-key="${esc(o.key)}" data-list="1" placeholder="(using defaults — one item per line)">${esc(items)}</textarea>`;
          actions = `<button class="apply" data-apply="${esc(o.key)}">Apply</button>`;
        } else {
          const cur = userVals ? userVals[userVals.length - 1] : null;
          control = controlHtml(o, cur);
          actions = modified ? `<button data-reset="${esc(o.key)}">reset</button>` : "";
        }
        html +=
          `<div class="row ${modified ? "modified" : ""}" title="${esc(o.doc.slice(0, 600))}">` +
          `<span><span class="k">${esc(o.key)}</span>${plat}<span class="d">${shortDoc}</span></span>` +
          `<span>${control}</span><span>${actions}</span></div>`;
      }
    }
    formBody.innerHTML = html || "<p>No matches.</p>";
  }

  async function saveSet(payload) {
    try {
      const r = await postApi("/api/config/set", payload);
      if (r.ok) {
        setContent(r.content);
        renderForm();
        showBanner("ok", reloadHintHtml(`Saved ${payload.key}.`));
      } else {
        const msgs = [
          ...(r.lint?.diagnostics || []).map((d) => d.message),
          ...(r.lint?.fileLevel || []).map((f) => f.message),
        ];
        showBanner("bad", esc(`Not saved (${payload.key}): ${msgs[0] || r.reason}`));
        renderForm();
      }
    } catch (err) {
      showBanner("bad", esc(err.message));
    }
  }

  formBody.addEventListener("change", (e) => {
    const t = e.target;
    const key = t.dataset.key;
    if (!key || t.dataset.list) return;
    if (t.dataset.role === "swatch") {
      const text = t.parentElement.querySelector('input[type="text"]');
      text.value = t.value;
      return saveSet({ key, value: t.value });
    }
    const value = t.type === "checkbox" ? (t.checked ? "true" : "false") : t.value;
    return value === "" ? saveSet({ key, unset: true }) : saveSet({ key, value });
  });

  formBody.addEventListener("click", (e) => {
    const reset = e.target.dataset.reset;
    if (reset) return saveSet({ key: reset, unset: true });
    const apply = e.target.dataset.apply;
    if (apply) {
      const ta = formBody.querySelector(`textarea[data-key="${CSS.escape(apply)}"]`);
      const values = ta.value.split("\n").map((s) => s.trim()).filter(Boolean);
      return values.length
        ? saveSet({ key: apply, values })
        : saveSet({ key: apply, unset: true });
    }
  });

  formSearch.addEventListener("input", renderForm);

  const lintStatus = document.getElementById("lint-status");
  const diagnosticsList = document.getElementById("diagnostics");
  let lintTimer = null;
  let lintSeq = 0;

  async function runLint() {
    const seq = ++lintSeq;
    lintStatus.className = "";
    lintStatus.textContent = "Checking…";
    try {
      const r = await postApi("/api/lint", { content: editor.value });
      if (seq !== lintSeq) return; // a newer edit superseded this result
      // Messages embed user-typed config values — escape everything.
      const items = [
        ...r.diagnostics.map((d) =>
          `<li data-line="${Number(d.line)}"><span class="loc">line ${Number(d.line)}</span>` +
          `<span class="key">${esc(d.key)}</span>${esc(d.message)}</li>`),
        ...r.fileLevel.map((f) => `<li><span class="loc">file</span>${esc(f.message)}</li>`),
      ];
      diagnosticsList.innerHTML = items.join("");
      const n = r.diagnostics.length + r.fileLevel.length;
      lintStatus.className = r.ok ? "ok" : "bad";
      lintStatus.textContent = r.ok
        ? "✓ Valid config (checked by your Ghostty binary)"
        : `✕ ${n} problem${n === 1 ? "" : "s"}`;
    } catch (err) {
      if (seq !== lintSeq) return;
      lintStatus.className = "bad";
      lintStatus.textContent = `Lint failed: ${err.message}`;
    }
  }

  editor.addEventListener("input", () => {
    clearTimeout(lintTimer);
    lintTimer = setTimeout(runLint, 400);
  });

  // Clicking a line-anchored diagnostic moves the cursor to that line.
  diagnosticsList.addEventListener("click", (e) => {
    let line = e.target.closest("li")?.dataset.line;
    if (!line) return;
    line = Math.max(1, Number(line));
    const lines = editor.value.split("\n");
    const pos = lines.slice(0, line - 1).join("\n").length + (line > 1 ? 1 : 0);
    editor.focus();
    editor.setSelectionRange(pos, pos + (lines[line - 1] || "").length);
  });

  (async () => {
    try {
      meta = await api("/api/meta");
      document.getElementById("version").textContent = meta.ghosttyVersion;
      const cfg = await api("/api/config");
      document.getElementById("config-path").textContent =
        cfg.path + (cfg.exists ? "" : "  (does not exist yet)");
      setContent(cfg.content);
    } catch (err) {
      const el = document.getElementById("error");
      el.hidden = false;
      el.textContent = err.message + (token ? "" : " — open the tokened URL printed by the server");
    }
  })();
</script>
</body>
</html>
