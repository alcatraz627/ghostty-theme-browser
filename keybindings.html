<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghostty Keyboard Shortcuts</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f5f5f5;
      color: #333;
      line-height: 1.6;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid #e0e0e0;
    }

    .header h1 {
      font-size: 28px;
      color: #222;
    }

    .back-link {
      color: #4a90e2;
      text-decoration: none;
      font-size: 14px;
      padding: 8px 12px;
      border: 1px solid #4a90e2;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .back-link:hover {
      background: #4a90e2;
      color: white;
    }

    .content {
      background: white;
      border-radius: 8px;
      padding: 40px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .content h2 {
      font-size: 20px;
      margin-top: 30px;
      margin-bottom: 15px;
      color: #222;
      border-bottom: 2px solid #f0f0f0;
      padding-bottom: 10px;
    }

    .content h2:first-child {
      margin-top: 0;
    }

    .content p {
      margin-bottom: 15px;
      color: #555;
    }

    .content table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .content table th {
      background: #f9f9f9;
      padding: 12px;
      text-align: left;
      font-weight: 600;
      border-bottom: 2px solid #e0e0e0;
      color: #222;
    }

    .content table td {
      padding: 12px;
      border-bottom: 1px solid #f0f0f0;
    }

    .content table tr:hover {
      background: #f9f9f9;
    }

    .content kbd {
      display: inline-block;
      padding: 3px 8px;
      background: #f0f0f0;
      border: 1px solid #d0d0d0;
      border-radius: 3px;
      font-family: 'Monaco', monospace;
      font-size: 12px;
      color: #333;
    }

    .note {
      background: #f0f7ff;
      border-left: 4px solid #4a90e2;
      padding: 15px;
      margin-top: 30px;
      border-radius: 4px;
      font-size: 13px;
      color: #333;
    }

    .note strong {
      color: #222;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
      color: #999;
      font-size: 16px;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #ddd;
      border-top-color: #4a90e2;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error {
      color: #d32f2f;
      background: #ffebee;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 20px;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>⌨️ Ghostty Keyboard Shortcuts</h1>
      <a href="index.html" class="back-link">← Back to Themes</a>
    </div>

    <div class="content" id="content">
      <div class="loading">
        <span class="spinner"></span>
        Loading keybindings...
      </div>
    </div>
  </div>

  <script>
    // Simple markdown to HTML converter
    function markdownToHtml(markdown) {
      let html = markdown;

      // Escape HTML
      html = html
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      // Headers
      html = html.replace(/^### (.*?)$/gm, '<h3>$1</h3>');
      html = html.replace(/^## (.*?)$/gm, '<h2>$1</h2>');
      html = html.replace(/^# (.*?)$/gm, '<h1>$1</h1>');

      // Paragraphs
      html = html
        .split('\n\n')
        .map((para) => {
          // Skip if it's already a heading or table
          if (
            para.match(/^<h[1-3]>/) ||
            para.match(/^\|/) ||
            para.match(/^Note:/)
          ) {
            return para;
          }
          return `<p>${para}</p>`;
        })
        .join('\n\n');

      // Tables
      html = html.replace(/\n(\|.*\n)+/gm, (match) => {
        const lines = match.trim().split('\n');
        const rows = lines
          .map((line) => {
            const cells = line.split('|').slice(1, -1);
            const isHeader = line.includes('--');
            if (isHeader) return null;
            const tag = lines.indexOf(line) === 0 ? 'th' : 'td';
            return `<tr>${cells
              .map((cell) => `<${tag}>${cell.trim()}</${tag}>`)
              .join('')}</tr>`;
          })
          .filter((row) => row !== null);

        return `<table>${rows.join('')}</table>`;
      });

      // Bold
      html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

      // Inline code
      html = html.replace(/`([^`]+)`/g, '<kbd>$1</kbd>');

      // Note section (special handling)
      html = html.replace(
        /^Note: (.*?)$/gm,
        '<div class="note"><strong>Note:</strong> $1</div>'
      );

      return html;
    }

    function loadKeybindings() {
      const contentDiv = document.getElementById('content');

      const markdown = `# Ghostty Keyboard Shortcuts

Default keyboard shortcuts for Ghostty terminal emulator. Platform-specific differences are noted where applicable.

## Window Management

| Action | Windows/Linux | macOS |
|--------|--------------|-------|
| New window | Ctrl+Shift+N | Cmd+N |
| Close window | Alt+F4 | Cmd+Shift+W |
| Close all windows | - | Cmd+Shift+Option+W |
| Toggle fullscreen | Ctrl+Enter | Cmd+Enter or Cmd+Ctrl+F |
| Quit application | Ctrl+Shift+Q | Cmd+Q |

## Tab Management

| Action | Windows/Linux | macOS |
|--------|--------------|-------|
| New tab | Ctrl+Shift+T | Cmd+T |
| Close tab/surface | Ctrl+Shift+W | Cmd+W |
| Previous tab | Ctrl+Shift+Tab, Ctrl+Shift+Left, Ctrl+Page Up | Cmd+Shift+[ |
| Next tab | Ctrl+Tab, Ctrl+Shift+Right, Ctrl+Page Down | Cmd+Shift+] |
| Go to tab 1-8 | Alt+[1-8] | Cmd+[1-8] |
| Go to last tab | Alt+9 | Cmd+9 |
| Move tab | - | - |

## Split Management

| Action | Windows/Linux | macOS |
|--------|--------------|-------|
| New split (right) | Ctrl+Shift+O | Cmd+D |
| New split (down) | Ctrl+Shift+E | Cmd+Shift+D |
| Focus previous split | Ctrl+Super+[ | Cmd+[ |
| Focus next split | Ctrl+Super+] | Cmd+] |
| Focus split up | Ctrl+Alt+Up | Cmd+Option+Up |
| Focus split down | Ctrl+Alt+Down | Cmd+Option+Down |
| Focus split left | Ctrl+Alt+Left | Cmd+Option+Left |
| Focus split right | Ctrl+Alt+Right | Cmd+Option+Right |
| Toggle split zoom | Ctrl+Shift+Enter | Cmd+Shift+Enter |
| Resize split up | Ctrl+Super+Shift+Up | Cmd+Ctrl+Up |
| Resize split down | Ctrl+Super+Shift+Down | Cmd+Ctrl+Down |
| Resize split left | Ctrl+Super+Shift+Left | Cmd+Ctrl+Left |
| Resize split right | Ctrl+Super+Shift+Right | Cmd+Ctrl+Right |
| Equalize splits | Ctrl+Super+Shift+= | Cmd+Ctrl+= |

## Copy & Paste

| Action | Windows/Linux | macOS |
|--------|--------------|-------|
| Copy | Ctrl+Shift+C | Cmd+C |
| Paste | Ctrl+Shift+V | Cmd+V |
| Paste from selection | Shift+Insert | - |

## Text Navigation

| Action | Windows/Linux | macOS |
|--------|--------------|-------|
| Scroll to top | Shift+Home | Cmd+Home |
| Scroll to bottom | Shift+End | Cmd+End |
| Scroll page up | Shift+Page Up | Cmd+Page Up |
| Scroll page down | Shift+Page Down | Cmd+Page Down |
| Jump to previous prompt | Ctrl+Shift+Page Up | Cmd+Up |
| Jump to next prompt | Ctrl+Shift+Page Down | Cmd+Down |
| Clear screen | - | Cmd+K |

## Font Size

| Action | Windows/Linux | macOS |
|--------|--------------|-------|
| Increase font size | Ctrl++/Ctrl+= | Cmd++/Cmd+= |
| Decrease font size | Ctrl+- | Cmd+- |
| Reset font size | Ctrl+0 | Cmd+0 |

## Configuration

| Action | Windows/Linux | macOS |
|--------|--------------|-------|
| Open config | Ctrl+, | Cmd+, |
| Reload config | Ctrl+Shift+, | Cmd+Shift+, |

## Inspector

| Action | Windows/Linux | macOS |
|--------|--------------|-------|
| Toggle inspector | Ctrl+Shift+I | Cmd+Option+I |

## Scrollback

| Action | Windows/Linux | macOS |
|--------|--------------|-------|
| Write scrollback to file (paste) | Ctrl+Shift+J | Cmd+Shift+J |
| Write scrollback to file (open) | Ctrl+Shift+Alt+J | Cmd+Shift+Option+J |

Note: These are the default keybindings. All keybindings can be customized through the configuration file using the \`keybind\` option.`;

      try {
        const html = markdownToHtml(markdown);
        contentDiv.innerHTML = html;
      } catch (error) {
        console.error('Error rendering keybindings:', error);
        contentDiv.innerHTML = `
          <div class="error">
            <strong>Error rendering keybindings:</strong> ${error.message}
          </div>
        `;
      }
    }

    // Load keybindings on page load
    window.addEventListener('load', loadKeybindings);
  </script>
</body>
</html>
